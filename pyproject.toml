[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: "mathlas" is a PROVISIONAL name — availability-check on PyPI before
# publishing (cf. splatreg, where the first pick "gsfit" was already taken).
name = "mathlas"
version = "0.1.0"
description = "A tool FOR an AI (no API key): search existing math + airtight verification + needs<->guarantees scaffolds + provenance, over MCP."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Krishi Attri", email = "krishiattriwork@gmail.com" }]
keywords = ["mathematics", "symbolic", "pslq", "theorem-retrieval", "verification", "mcp", "oeis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]
# Core (numeric + retrieval + verify + scaffolds) runs with NO LLM, NO API key.
dependencies = ["mpmath>=1.3", "sympy>=1.12", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]                              # official MCP SDK for the server (a dep-free stdio fallback ships built in)
# identify_sequence (OEIS) needs NO extra deps: it reads the local stripped.gz /
# names.gz with the stdlib (gzip). Download them once into reference/downloads/oeis
# (see docs/04_build.md); the Lean tier (verify_formal) uses an elan-installed
# `lean` resolved at runtime (no Python dep). Hence no [sequences]/[formal] extras.
retrieve = ["pyarrow>=14"]                      # read the open dataset parquets
embed = ["sentence-transformers>=3.0", "torch>=2.1"]  # Qwen3 production embedder (offline GPU)

[project.scripts]
mathlas = "mathlas.cli:main"
mathlas-mcp = "mathlas.server:main"

[tool.setuptools.packages.find]
include = ["mathlas*"]
