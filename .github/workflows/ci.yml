name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (CPU airtight suite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11+ : tests/test_version_metadata.py uses the stdlib tomllib (3.11+).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run CPU airtight regression suite
        # Lean-kernel, live-network and optional heavy-dep (pyarrow/datasets)
        # tests skip honestly when their toolchain/deps are absent on the runner.
        run: pytest -q
