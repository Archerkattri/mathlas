name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: source and CLI verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[retrieve]" pytest datasets
      - name: Compile package sources
        run: python -m compileall -q mathlas
      - name: Verify CLI entry point
        run: mathlas --help
      - name: Run data-pipeline and Lean integration checks
        run: python -m pytest -q tests/test_hf_upload_corpus.py tests/test_proof_check.py
